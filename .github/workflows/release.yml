name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: "release-pages"
  cancel-in-progress: false

permissions:
  pages: write
  id-token: write

env:
  CI: true
jobs:
  pre-checks:
    name: Run Tests and Linter
    uses: ./.github/workflows/tests-and-lint.yml

  release:
    name: Release
    needs: pre-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_GITHUB }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Build
        run: pnpm build

      - name: Setup Git User
        shell: bash
        run: |
          git config --global user.email "196216297+adara-cloud-ci@users.noreply.github.com"
          git config --global user.name "Adara Cloud CI"

      - name: Publish versions
        uses: changesets/action@v1.9.0
        with:
          commit: "chore: update versions"
          title: "chore: update versions"
          version: pnpm ci:version
          publish: pnpm ci:publish
          setupGitUser: false
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB }}
          NODE_ENV: "production"

      - name: Build docs site
        run: pnpm --filter @vega-ui/docs site:build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}

      - name: Resolve Playwright version
        id: resolve-playwright
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
            const match = lock.match(/^\\s*playwright@(\\d+\\.\\d+\\.\\d+):/m);
            if (!match) {
              console.error('Playwright not found in pnpm-lock.yaml');
              process.exit(1);
            }
            console.log('PLAYWRIGHT_VERSION=' + match[1]);
          " >> "$GITHUB_OUTPUT"

      - name: Cache Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.resolve-playwright.outputs.PLAYWRIGHT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright Dependencies
        shell: bash
        run: pnpm exec playwright install --with-deps chromium-headless-shell

      - name: Check docs site
        run: pnpm --filter @vega-ui/docs site:check
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}

      - name: Build storybook
        run: npm run build-storybook -- --output-dir apps/docs/out/storybook

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/out/

      - name: Deploy site to GitHub Pages
        uses: actions/deploy-pages@v5
        with:
          token: ${{ github.token }}
