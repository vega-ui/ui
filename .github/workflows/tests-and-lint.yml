name: Tests and Lint

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  lint-and-test:
    name: Tests and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Linter
        run: pnpm run lint

      - name: Validate Docs
        run: pnpm docs:validate

      - name: Typecheck
        run: pnpm --filter @vega-ui/react exec tsc -p tsconfig.app.json --noEmit

      - name: Run Unit Tests
        run: pnpm turbo run test --filter=@vega-ui/utils --filter=@vega-ui/i18n

  browser-tests:
    name: Browser Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            playwright: chromium-headless-shell
          - browser: firefox
            playwright: firefox
          - browser: webkit
            playwright: webkit

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Resolve Playwright version
        id: resolve-playwright
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
            const match = lock.match(/^\\s*playwright@(\\d+\\.\\d+\\.\\d+):/m);
            if (!match) {
              console.error('Playwright not found in pnpm-lock.yaml');
              process.exit(1);
            }
            console.log('PLAYWRIGHT_VERSION=' + match[1]);
          " >> "$GITHUB_OUTPUT"

      - name: Print versions
        shell: bash
        run: echo "${{ toJson(steps.resolve-playwright.outputs) }}"

      - name: Check resolved package versions
        shell: bash
        if: |
          contains(fromJSON('[null, "", "undefined"]'), steps.resolve-playwright.outputs.PLAYWRIGHT_VERSION)
        run: echo "Failed to resolve package versions. See log above." && exit 1

      - name: Cache Playwright
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ steps.resolve-playwright.outputs.PLAYWRIGHT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.browser }}-

      - name: Install Playwright Dependencies
        shell: bash
        run: pnpm exec playwright install --with-deps ${{ matrix.playwright }}

      - name: Run Hooks Tests
        if: matrix.browser == 'chromium'
        run: pnpm turbo run test --filter=@vega-ui/hooks

      - name: Run UI Tests
        run: pnpm --filter @vega-ui/react exec vitest run --project ${{ matrix.browser }}
