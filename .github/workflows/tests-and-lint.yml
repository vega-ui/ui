name: Tests and Lint

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ github.event_name != 'pull_request' || steps.filter.outputs.browser == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}

    steps:
      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - '.github/workflows/**'
            browser:
              - *shared
              - 'packages/**/!(*.stories.tsx|*.mdx)'
              - 'vitest.shared.ts'
            docs:
              - *shared
              - 'packages/**'
              - 'apps/docs/**'
              - 'docs/**'
              - 'scripts/**'

  lint-and-test:
    name: Tests and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Run Linter
        run: pnpm run lint

      - name: Validate Docs
        run: pnpm docs:validate

      - name: Check Doc Examples
        run: pnpm docs:examples:check

      - name: Check API Docs
        run: pnpm docs:api:check

      - name: Check Keyboard Docs
        run: pnpm docs:keyboard:check

      - name: Typecheck
        run: pnpm turbo run check-types

      - name: Run Unit Tests
        run: pnpm turbo run test --filter=@vega-ui/utils --filter=@vega-ui/i18n

  browser-tests:
    name: Browser Tests (${{ matrix.browser }})
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Browser Tests
        run: pnpm turbo run test --filter=@vega-ui/hooks --filter=@vega-ui/icons --filter=@vega-ui/react-context --filter=@vega-ui/react -- --project ${{ matrix.browser }}

  docs-site:
    name: Docs Site
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Build packages
        run: pnpm turbo run build --filter=@vega-ui/docs^...

      - name: Build docs site
        run: pnpm --filter @vega-ui/docs site:build
        env:
          PAGES_BASE_PATH: /ui

      - name: Check docs site
        run: pnpm --filter @vega-ui/docs site:check
        env:
          PAGES_BASE_PATH: /ui

      - name: Verify keyboard docs
        run: pnpm docs:keyboard:verify --out apps/docs/out
        env:
          PAGES_BASE_PATH: /ui
